apiVersion: v1
kind: ConfigMap
metadata: { name: web-config, namespace: demo }
data: { GREETING: "hello from config" }
---
apiVersion: v1
kind: Secret
metadata: { name: web-secret, namespace: demo }
type: Opaque
stringData: { API_KEY: "not-a-real-key" }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: web, namespace: demo }
spec:
  replicas: 2
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      containers:
        - name: web
          image: nginx:1.27
          ports: [{ containerPort: 80 }]
          envFrom:
            - configMapRef: { name: web-config }
            - secretRef: { name: web-secret }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /, port: 80 }
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: demo }
spec:
  selector: { app: web }
  ports: [{ name: http, port: 80, targetPort: 80 }]
